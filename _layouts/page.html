---
layout: default
---
<header class="page-head reveal">
  <h1>{{ page.title }}</h1>
  {%- if page.subtitle %}
  <p class="page-head__sub">{{ page.subtitle }}</p>
  {%- elsif page.subtitle_key %}
  <p class="page-head__sub">{{ site.data.i18n[page.lang][page.subtitle_key] }}</p>
  {%- endif %}
</header>

{{ content }}
