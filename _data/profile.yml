# Ana sayfadaki serbest paragraflar (Markdown kullanabilirsiniz)
bio:
  en:
    - >
      I completed my medical degree at Bursa Uludağ University, my residency in
      neurology at Istanbul Medipol University (2021) and a PhD in neuroscience
      at the same university (2025). I now teach in the Department of Neurology
      and see patients at Medipol Mega University Hospital — mainly epilepsy and
      EEG, movement disorders, dementia, disorders of consciousness and stroke.
    - >
      A central question in my work is what consciousness looks like in the
      brain's electrical activity. Using EEG microstate analysis I study the
      neural correlates of consciousness and how they break down in disorders of
      consciousness — coma, unresponsive wakefulness and the minimally conscious
      state — where the bedside examination alone often cannot separate one
      condition from another. What I am after is objective EEG markers that say
      something about a patient's residual awareness and prognosis.
    - >
      The same methods carry over to other conditions. With EEG microstates and
      quantitative EEG I follow how resting-state networks reorganise in
      Parkinson's disease and Alzheimer's disease, and how non-invasive
      neuromodulation — rTMS, tDCS and tACS — changes them.
    - >
      I work in the Clinical Electrophysiology, Neuroimaging and Neuromodulation
      Laboratory (SABİTA / REMER) and the Brain and Cognition Research Centre
      (BEYKOG), and I am a co-author in the international *EEG-meta-microstates*
      consortium led by Prof. Christoph M. Michel (University of Geneva), which
      works towards making microstate findings comparable across studies and
      sites.
  tr:
    - >
      Tıp eğitimimi Bursa Uludağ Üniversitesi'nde, nöroloji uzmanlık eğitimimi
      İstanbul Medipol Üniversitesi'nde (2021) ve sinirbilim doktoramı yine aynı
      üniversitede (2025) tamamladım. Hâlen Nöroloji Anabilim Dalı'nda ders
      veriyor, Medipol Mega Üniversite Hastanesi'nde başta epilepsi ve EEG,
      hareket bozuklukları, demans, bilinç bozuklukları ve inme olmak üzere
      hasta kabul ediyorum.
    - >
      Çalışmalarımın merkezinde şu soru duruyor: Bilinç, beynin elektriksel
      etkinliğinde nasıl görünür? EEG mikrodurum analiziyle bilincin nöral
      korelatlarını ve bunların bilinç bozukluklarında — koma, tepkisiz
      uyanıklık ve minimal bilinçli durum — nasıl bozulduğunu inceliyorum; bu
      tablolarda klinik muayene tek başına çoğu zaman ayrım yapmaya yetmiyor.
      Peşinde olduğum şey, hastanın artakalan farkındalığı ve gidişatı hakkında
      bilgi veren nesnel EEG belirteçleri.
    - >
      Aynı yöntemler başka tablolarda da işe yarıyor. EEG mikrodurumları ve
      nicel EEG (qEEG) ile Parkinson ve Alzheimer hastalığında dinlenim durumu
      ağlarının nasıl yeniden örgütlendiğini, invaziv olmayan nöromodülasyonun —
      rTMS, tDCS ve tACS — bu ağları nasıl değiştirdiğini izliyorum.
    - >
      Klinik Elektrofizyoloji, Nörogörüntüleme ve Nöromodülasyon Laboratuvarı
      (SABİTA / REMER) ile Beyin ve Biliş Araştırmaları Merkezi (BEYKOG)
      bünyesinde çalışıyorum. Ayrıca mikrodurum bulgularının çalışmalar ve
      merkezler arasında karşılaştırılabilir hâle getirilmesini amaçlayan,
      Cenevre Üniversitesi'nden Prof. Christoph M. Michel öncülüğündeki
      uluslararası *EEG-meta-microstates* konsorsiyumunun ortak yazarlarındanım.

